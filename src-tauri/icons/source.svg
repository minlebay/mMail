<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="base" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#2c2550"/>
      <stop offset="1" stop-color="#110e1f"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <clipPath id="orb">
      <circle cx="256" cy="256" r="228"/>
    </clipPath>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.65"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.12"/>
    </linearGradient>
  </defs>

  <!-- тень под шаром -->
  <circle cx="256" cy="270" r="226" fill="#000" opacity="0.35" filter="url(#shadow)"/>

  <g clip-path="url(#orb)">
    <circle cx="256" cy="256" r="228" fill="url(#base)"/>
    <!-- те же пятна, что на фоне приложения -->
    <g filter="url(#soft)">
      <circle cx="150" cy="150" r="118" fill="#8b7bff"/>
      <circle cx="385" cy="235" r="122" fill="#ff4f8b"/>
      <circle cx="240" cy="430" r="112" fill="#1fbf84"/>
    </g>
    <!-- стекло -->
    <circle cx="256" cy="256" r="228" fill="#fff" opacity="0.06"/>

    <!-- конверт -->
    <rect x="146" y="176" width="220" height="160" rx="30" fill="url(#paper)" stroke="#fff" stroke-width="20"/>
    <path d="M164 198l92 70 92-70" fill="none" stroke="#fff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- блик сверху -->
    <ellipse cx="256" cy="128" rx="168" ry="92" fill="url(#gloss)" opacity="0.55"/>
  </g>

  <circle cx="256" cy="256" r="226" fill="none" stroke="url(#rim)" stroke-width="5"/>
</svg>
