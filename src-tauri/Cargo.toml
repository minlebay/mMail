[package]
name = "mmail"
version = "0.1.0"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
ammonia = "4"
wayland-backend = { version = "0.3", features = ["client_system"] }
gtk = "0.18"
wayland-client = "0.31"
wayland-protocols-plasma = { version = "0.3", features = ["client"] }
lol_html = "3.0.1"
url = "2"
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"
mail-parser = "0.11"
zeroize = "1"
futures = "0.3"
secret-service = { version = "5", features = ["rt-tokio-crypto-rust"] }
chrono = "0.4"
ureq = { version = "3", default-features = false, features = ["rustls"] }
serde_json = "1"
base64 = "0.22"
webkit2gtk = "2.0"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls"] }
tauri-plugin-dialog = "2"
mime_guess = "2"
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher"] }
getrandom = "0.4.3"
sha2 = "0.11.1"
notify-rust = "4.18.2"
tauri-plugin-single-instance = "2"
percent-encoding = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Сборка для разработки без полной отладочной информации: target/ в разы меньше,
# а в трассировке паники остаются файл и строка.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
