[package]
name = "mmail"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
ammonia = "4"
wayland-backend = { version = "0.3", features = ["client_system"] }
gtk = "0.18"
wayland-client = "0.31"
wayland-protocols-plasma = { version = "0.3", features = ["client"] }
lol_html = "3.0.1"
url = "2"
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"
mail-parser = "0.11"
zeroize = "1"
futures = "0.3"
secret-service = { version = "5", features = ["rt-tokio-crypto-rust"] }
chrono = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
